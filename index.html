<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Cyber Security Lab - GIC Gaujani</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #161b22; border: 2px solid #30363d; border-radius: 12px; padding: 30px; width: 100%; max-width: 650px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; margin-bottom: 5px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .school-name { color: #8b949e; font-size: 14px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .view-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 10px 20px; margin: 10px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: bold; width: 80%; }
        .view-btn:hover { background: #30363d; border-color: #8b949e; }
        .screen { display: none; }
        .active { display: block; }
        
        /* Input Fields Styling */
        .input-label { text-align: left; display: block; color: #8b949e; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #58a6ff; font-size: 18px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        #passwordInput { text-transform: uppercase; letter-spacing: 3px; }
        
        button.action-btn { background: #238636; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button.action-btn:hover { background: #2ea043; }
        
        .console-box { background: #000; border: 1px solid #00ff00; border-radius: 6px; padding: 20px; text-align: left; min-height: 400px; overflow-y: auto; color: #00ff00; font-size: 14px; line-height: 1.7; box-shadow: inset 0 0 10px rgba(0,255,0,0.2); }
        .matrix-display { display: inline-block; border-left: 2px solid #00ff00; border-right: 2px solid #00ff00; padding: 0 8px; margin: 5px 5px; font-weight: bold; text-align: center; vertical-align: middle; }
        .highlight { color: #ffffff; font-weight: bold; }
        .accent { color: #ff9e00; }
        
        .alert-box { border: 2px dashed #ff9e00; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: rgba(255, 158, 0, 0.1); }
        .decode-btn { background: #d32f2f; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; animation: pulse 1.5s infinite; }
        .decode-btn:hover { background: #b71c1c; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 10px rgba(211, 47, 47, 0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
        <h1>Matrix Cyber Lab</h1>
        <p class="school-name">G.I.C. Gaujani (Nainital) - Science Exhibition</p>
        <p style="margin-bottom: 20px; color: #8b949e;">Choose the role for this device:</p>
        <button class="view-btn" onclick="switchView('user')">📱 Tablet 1: User Input (Front-End)</button>
        <br>
        <button class="view-btn" onclick="switchView('backend')">🖥️ Tablet 2: Control Room (Back-End)</button>
    </div>

    <!-- FRONT-END: USER INPUT SCREEN -->
    <div id="user-screen" class="screen">
        <h1>Secure Cyber Portal</h1>
        <p class="school-name">G.I.C. Gaujani (Nainital)</p>
        
        <label class="input-label">1. Enter Your Name (आपका नाम):</label>
        <input type="text" id="userNameInput" placeholder="e.g., Rahul Kumar" autocomplete="off">
        
        <label class="input-label">2. Enter 4-Letter Secret Password:</label>
        <input type="text" id="passwordInput" maxlength="4" placeholder="e.g., SAFE, CODE" autocomplete="off">
        
        <button class="action-btn" onclick="sendPassword()">🔒 Encrypt & Transmit</button>
        <p id="statusMsg" style="margin-top: 15px; color: #3fb950; font-weight: bold;"></p>
    </div>

    <!-- BACK-END: CONTROL ROOM SCREEN -->
    <div id="backend-screen" class="screen">
        <h1 style="color: #00ff00;">Matrix Back-End Console</h1>
        <p class="school-name" style="color: #00ff00; border-bottom: 1px solid #00ff00; padding-bottom: 10px; margin-bottom: 15px;">Live Decryption Server - G.I.C. Gaujani</p>
        <div class="console-box" id="consoleOutput">
            [SYSTEM] Awaiting live secure packet from Tablet 1...
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCMJAwYZFczjJX7AfFth4j72C0NQY4TU8g",
        authDomain: "matrix-lab-ccac3.firebaseapp.com",
        databaseURL: "https://matrix-lab-ccac3-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "matrix-lab-ccac3",
        storageBucket: "matrix-lab-ccac3.firebasestorage.app",
        messagingSenderId: "590930858643",
        appId: "1:590930858643:web:f4fd5e8514b6044560f366"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        
        if (mode === 'user') {
            switchView('user');
        } else if (mode === 'backend') {
            switchView('backend');
        }
    };

    // Global Matrices
    const keyMatrix = [[2, 1], [1, 3]]; 
    const invMatrix = [[0.6, -0.2], [-0.2, 0.4]]; 

    window.switchView = function(view) {
        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById(view + '-screen').classList.add('active');
        if (view === 'backend') listenForData();
    }

    // Tablet 1: Send Data
    window.sendPassword = function() {
        const name = document.getElementById('userNameInput').value.trim();
        const pass = document.getElementById('passwordInput').value.toUpperCase().trim();
        
        if (name === "") {
            alert("Please enter your name first!");
            return;
        }
        if (pass.length !== 4 || !/^[A-Z]{4}$/.test(pass)) {
            alert("Please enter exactly 4 english letters in password! (Example: SAFE)");
            return;
        }
        
        document.getElementById('statusMsg').innerText = "Transmitting secure packet...";
        
        set(ref(db, 'secureChannel/packet'), {
            userName: name,
            text: pass,
            timestamp: Date.now()
        }).then(() => {
            document.getElementById('statusMsg').innerText = "✅ Sent! Check Tablet 2 (Control Room).";
            document.getElementById('passwordInput').value = "";
            setTimeout(() => { document.getElementById('statusMsg').innerText = ""; }, 3000);
        }).catch((error) => {
            alert("Connection Error. Please check your internet.");
        });
    }

    // Tablet 2: Listen for Data
    function listenForData() {
        const consoleEl = document.getElementById('consoleOutput');

        onValue(ref(db, 'secureChannel/packet'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (Date.now() - data.timestamp > 10000) return; // Ignore old data

            // Pre-calculate the encrypted matrix to show in the alert message
            const char1 = data.text.charCodeAt(0) - 64; 
            const char2 = data.text.charCodeAt(1) - 64;
            const char3 = data.text.charCodeAt(2) - 64; 
            const char4 = data.text.charCodeAt(3) - 64;

            const c1 = (keyMatrix[0][0] * char1) + (keyMatrix[0][1] * char2);
            const c2 = (keyMatrix[1][0] * char1) + (keyMatrix[1][1] * char2);
            const c3 = (keyMatrix[0][0] * char3) + (keyMatrix[0][1] * char4);
            const c4 = (keyMatrix[1][0] * char3) + (keyMatrix[1][1] * char4);

            // Display Alert Box with Name, Encrypted Data and Decode Button
            consoleEl.innerHTML = `
                <div class="alert-box">
                    <span style="color:#ff9e00; font-size:18px; font-weight:bold;">🚨 NEW SECURE PACKET RECEIVED!</span><br><br>
                    👤 <b>यूज़र (User):</b> <span class="highlight" style="font-size:16px;">${data.userName}</span> ने पासवर्ड डाला है।<br><br>
                    🔒 <b>Encrypted Password (Ciphertext):</b><br> 
                    <span style="color:#ff9e00; font-size:18px; font-weight:bold;">[ ${c1}, ${c2} ] & [ ${c3}, ${c4} ]</span><br>
                    <button class="decode-btn" id="startDecodeBtn" onclick="startDecryption('${data.text}')">
                        🔓 क्या इसको डिकोड करें? (Start Decryption)
                    </button>
                </div>
                <div id="animationArea"></div>
            `;
        });
    }

    // Manual Decoding Animation Trigger
    window.startDecryption = function(text) {
        // Hide the button so it can't be clicked twice
        document.getElementById('startDecodeBtn').style.display = 'none';
        
        const animArea = document.getElementById('animationArea');
        animArea.innerHTML = `<br><span class="accent">[SYSTEM] Initiating Matrix Decryption Protocol...</span><br><br>`;
        
        setTimeout(() => {
            const char1 = text.charAt(0);
            const char2 = text.charAt(1);
            const char3 = text.charAt(2);
            const char4 = text.charAt(3);

            const val1 = char1.charCodeAt(0) - 64; 
            const val2 = char2.charCodeAt(0) - 64;
            const val3 = char3.charCodeAt(0) - 64; 
            const val4 = char4.charCodeAt(0) - 64;

            animArea.innerHTML += `➡️ <span class="highlight">Step 1: Plaintext to Matrix (Block Cipher)</span><br>`;
            animArea.innerHTML += `Block 1: "${char1}${char2}" &rarr; P1 = <div class="matrix-display">${val1}<br>${val2}</div><br>`;
            animArea.innerHTML += `Block 2: "${char3}${char4}" &rarr; P2 = <div class="matrix-display">${val3}<br>${val4}</div><br><br>`;
            
            setTimeout(() => {
                const c1 = (keyMatrix[0][0] * val1) + (keyMatrix[0][1] * val2);
                const c2 = (keyMatrix[1][0] * val1) + (keyMatrix[1][1] * val2);
                const c3 = (keyMatrix[0][0] * val3) + (keyMatrix[0][1] * val4);
                const c4 = (keyMatrix[1][0] * val3) + (keyMatrix[1][1] * val4);

                animArea.innerHTML += `➡️ <span class="highlight">Step 2: Matrix Multiplication (Encryption Process)</span><br>`;
                animArea.innerHTML += `Block 1: <div class="matrix-display">2 &nbsp; 1<br>1 &nbsp; 3</div> &times; <div class="matrix-display">${val1}<br>${val2}</div> = <div class="matrix-display" style="color:#ff9e00">${c1}<br>${c2}</div><br>`;
                animArea.innerHTML += `Block 2: <div class="matrix-display">2 &nbsp; 1<br>1 &nbsp; 3</div> &times; <div class="matrix-display">${val3}<br>${val4}</div> = <div class="matrix-display" style="color:#ff9e00">${c3}<br>${c4}</div><br><br>`;

                setTimeout(() => {
                    const p1 = Math.round((invMatrix[0][0] * c1) + (invMatrix[0][1] * c2));
                    const p2 = Math.round((invMatrix[1][0] * c1) + (invMatrix[1][1] * c2));
                    const origChar1 = String.fromCharCode(p1 + 64);
                    const origChar2 = String.fromCharCode(p2 + 64);

                    const p3 = Math.round((invMatrix[0][0] * c3) + (invMatrix[0][1] * c4));
                    const p4 = Math.round((invMatrix[1][0] * c3) + (invMatrix[1][1] * c4));
                    const origChar3 = String.fromCharCode(p3 + 64);
                    const origChar4 = String.fromCharCode(p4 + 64);

                    animArea.innerHTML += `➡️ <span class="highlight">Step 3: Decryption via Inverse Matrix</span><br>`;
                    animArea.innerHTML += `Formula: P = K⁻¹ &times; C<br>`;
                    animArea.innerHTML += `Block 1: <div class="matrix-display">0.6 &nbsp; -0.2<br>-0.2 &nbsp; 0.4</div> &times; <div class="matrix-display">${c1}<br>${c2}</div> = <div class="matrix-display">${p1}<br>${p2}</div> &rarr; "${origChar1}${origChar2}"<br>`;
                    animArea.innerHTML += `Block 2: <div class="matrix-display">0.6 &nbsp; -0.2<br>-0.2 &nbsp; 0.4</div> &times; <div class="matrix-display">${c3}<br>${c4}</div> = <div class="matrix-display">${p3}<br>${p4}</div> &rarr; "${origChar3}${origChar4}"<br><br>`;
                    
                    animArea.innerHTML += `🔓 <span style="color:#fff; background:#238636; padding:2px 5px;">[SUCCESS]</span> Deciphered Password: <span class="highlight" style="font-size: 18px; color: #58a6ff;">${origChar1}${origChar2}${origChar3}${origChar4}</span><br><br>----------------------------------------<br><br>`;
                    
                    const consoleOutput = document.getElementById('consoleOutput');
                    consoleOutput.scrollTop = consoleOutput.scrollHeight;
                }, 2500);
            }, 2500);
        }, 1000);
    }
</script>

</body>
</html>
